services:
  mysql:
    image: ${DOCKER_REGISTRY:-docker.io/library/}mysql:8.0
    container_name: ship-room-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3348}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-example_db}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ship-room-network

  redis:
    image: ${DOCKER_REGISTRY:-docker.io/library/}redis:7.2
    container_name: ship-room-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6426}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ship-room-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ship-room-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8132}:8132"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-example_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-password}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - ship-room-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ship-room-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8122}:80"
    depends_on:
      - backend
    networks:
      - ship-room-network

volumes:
  mysql-data:
  redis-data:

networks:
  ship-room-network:
    driver: bridge
